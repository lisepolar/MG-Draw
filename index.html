<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mounted Games – Lagfordeler</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:900px;margin:auto;padding:20px;background:#f6f6f6;color:#222}
.card{background:white;border:1px solid #ddd;border-radius:14px;padding:18px;margin:14px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
label{font-weight:600;font-size:14px;display:block;margin-bottom:5px}
input,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #bbb;border-radius:8px;font:inherit}
button{padding:12px 16px;border:0;border-radius:9px;font-weight:700;cursor:pointer;margin:5px 5px 0 0}
.primary{background:#222;color:white}
.small{color:#666;font-size:13px}
.heat{border:1px solid #ddd;border-radius:9px;padding:10px;margin:8px 0}
.team{display:inline-block;background:#eee;border-radius:6px;padding:4px 7px;margin:2px}
.good{color:#087a35;font-weight:700}.bad{color:#a00;font-weight:700}
.matrix{overflow:auto}.matrix table{border-collapse:collapse;font-size:12px}.matrix th,.matrix td{border:1px solid #ccc;padding:5px;text-align:center}
</style>
</head>
<body>
<h1>Mounted Games – Lagfordeler</h1>
<div class="card">
<div class="grid">
<div><label>Antall lag</label><input id="n" type="number" value="14" min="2" max="30"></div>
<div><label>Sessions</label><input id="s" type="number" value="3" min="1" max="8"></div>
<div><label>Antall heat</label><input id="h" type="number" value="4" min="1" max="8"></div>
</div>
<p><label>Lag per heat</label><input id="caps" value="4,4,3,3"></p>
<p class="small">Summen av heatstørrelsene må være lik antall lag.</p>
<p><label>Lagnavn – ett per linje</label>
<textarea id="names" rows="8">Lise
Oda
Sam
Celine
Karen
Rebecca
Sofie H
Amanda
Tuva
Klara
Amina
Alva
Josefine
Rikke</textarea></p>
<button class="primary" id="calc">Beregn beste løsning</button>
<button id="new">Ny variant</button>
<div id="status" class="small"></div>
</div>
<div id="result"></div>

<script>
const $=id=>document.getElementById(id);

function config(){
 const n=+$('n').value,s=+$('s').value,h=+$('h').value;
 const caps=$('caps').value.split(',').map(Number);
 const names=$('names').value.split(/\\n/).map(x=>x.trim()).filter(Boolean);
 return {n,s,h,caps,names};
}
function validate(c){
 if(c.caps.length!==c.h)return"Antall heatstørrelser må være lik antall heat.";
 if(c.caps.some(x=>!Number.isInteger(x)||x<1))return"Alle heat må ha minst 1 lag.";
 if(c.caps.reduce((a,b)=>a+b,0)!==c.n)return"Heatstørrelsene må summere til antall lag.";
 if(c.names.length!==c.n)return"Antall lagnavn må være lik antall lag.";
 if(new Set(c.names).size!==c.names.length)return"Lagnavn må være unike.";
 return "";
}
function shuffle(a){
 for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
 return a;
}
function candidate(c){
 const N=c.n,S=c.s,H=c.h,max=Math.max(...c.caps);
 const meet=Array.from({length:N},()=>Array(N).fill(0));
 const heatUse=Array.from({length:N},()=>Array(H).fill(0));
 const sessions=[];
 for(let s=0;s<S;s++){
   let rem=new Set([...Array(N).keys()]);
   let hs=[...Array(H).keys()].sort((a,b)=>c.caps[b]-c.caps[a]);
   const sess=[];
   for(const h of hs){
     const chosen=[];
     while(chosen.length<c.caps[h]){
       let best=[],bestScore=Infinity;
       for(const i of rem){
         let repeats=0,newOpp=0;
         for(const j of chosen){
           repeats+=meet[i][j];
           if(meet[i][j]===0)newOpp++;
         }
         let score=repeats*1000-newOpp*20+heatUse[i][h]*50+Math.random();
         if(score<bestScore){bestScore=score;best=[i]}
       }
       chosen.push(best[0]);rem.delete(best[0]);
     }
     shuffle(chosen);
     sess.push(chosen);
     chosen.forEach(i=>heatUse[i][h]++);
     for(let a=0;a<chosen.length;a++)for(let b=a+1;b<chosen.length;b++){
       meet[chosen[a]][chosen[b]]++;meet[chosen[b]][chosen[a]]++;
     }
   }
   sessions.push(sess);
 }
 let small=new Set(),full=new Set();
 for(const sess of sessions)for(let h=0;h<H;h++)for(const i of sess[h]){
   (c.caps[h]<max?small:full).add(i);
 }
 let unique=0,repeats=0,maxPair=0,over3=0;
 for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){
   if(meet[i][j]>0)unique++;
   if(meet[i][j]>1)repeats+=meet[i][j]-1;
   maxPair=Math.max(maxPair,meet[i][j]);
   if(meet[i][j]>2)over3++;
 }
 let distinctHeat=0;
 for(let i=0;i<N;i++)distinctHeat+=heatUse[i].filter(Boolean).length;
 return {sessions,meet,small:small.size,full:full.size,unique,repeats,maxPair,over3,distinctHeat};
}
function better(a,b){
 if(!b)return true;
 const A=[a.small,a.full,a.unique,-a.over3,-a.maxPair,-a.repeats,a.distinctHeat];
 const B=[b.small,b.full,b.unique,-b.over3,-b.maxPair,-b.repeats,b.distinctHeat];
 for(let i=0;i<A.length;i++)if(A[i]!==B[i])return A[i]>B[i];
 return false;
}
function solve(c){
 let best=null;
 const tries=Math.min(12000,Math.max(1500,800*c.n));
 for(let k=0;k<tries;k++){
   const z=candidate(c);
   if(better(z,best))best=z;
 }
 return best;
}
function render(c,z){
 let out='<div class="card"><b>Kontroll</b><p>'+
 'Lag i små heat: <b>'+z.small+'/'+c.n+'</b><br>'+
 'Lag i fulle heat: <b>'+z.full+'/'+c.n+'</b><br>'+
 'Forskjellige lagpar: <b>'+z.unique+'</b><br>'+
 'Gjennomgående maks antall møter mellom samme par: <b>'+z.maxPair+'</b><br>'+
 'Lagpar som møtes mer enn 2 ganger: <b>'+z.over3+'</b><br>'+
 'Gjentatte møter utover første: <b>'+z.repeats+'</b></p>'+
 '<div class="small">Dette er en søkebasert optimum-kandidat, ikke en matematisk bevisført optimum.</div></div>';
 z.sessions.forEach((sess,s)=>{
   out+='<div class="card"><h3>Session '+(s+1)+'</h3>';
   sess.forEach((heat,h)=>{
     out+='<div class="heat"><b>Heat '+(h+1)+' – '+heat.length+' lag</b><br>'+
       heat.map(i=>'<span class="team">'+c.names[i]+'</span>').join('')+'</div>';
   });
   out+='</div>';
 });
 let reps=[];
 for(let i=0;i<c.n;i++)for(let j=i+1;j<c.n;j++)if(z.meet[i][j]>1)
   reps.push(c.names[i]+' – '+c.names[j]+' ('+z.meet[i][j]+' møter)');
 out+='<div class="card"><b>Gjentatte møter</b><p>'+(reps.length?reps.join('<br>'):'Ingen')+'</p></div>';
 out+='<div class="card"><b>Komplett møte-matrise</b><div class="matrix"><table><tr><th></th>'+
 c.names.map(x=>'<th>'+x+'</th>').join('')+'</tr>';
 c.names.forEach((x,i)=>{
   out+='<tr><th>'+x+'</th>'+c.names.map((_,j)=>'<td>'+(i===j?'–':z.meet[i][j])+'</td>').join('')+'</tr>';
 });
 out+='</table></div></div>';
 $('result').innerHTML=out;
}
function run(){
 const c=config(),err=validate(c);
 $('result').innerHTML='';
 if(err){$('status').innerHTML='<span class="bad">'+err+'</span>';return}
 $('status').textContent='Beregner…';
 setTimeout(()=>{
   const z=solve(c);
   $('status').innerHTML='<span class="good">Ferdig.</span> Kontroller resultatet nedenfor.';
   render(c,z);
 },30);
}
$('calc').onclick=run;
$('new').onclick=run;
run();
</script>
</body>
</html>
