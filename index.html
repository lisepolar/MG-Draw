<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MG-Draw</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#202124;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}
label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}
input,textarea{width:100%;padding:10px;border:1px solid #bbb;border-radius:9px;font:inherit;background:#fff}
.name-editor{display:grid;grid-template-columns:34px 1fr;border:1px solid #bbb;border-radius:9px;background:#fff;overflow:hidden}
.line-numbers{padding:10px 7px 10px 0;text-align:right;color:#888;font:inherit;line-height:1.5;user-select:none;white-space:pre;overflow:hidden}
.name-editor textarea{border:0;border-radius:0;outline:none;resize:vertical;line-height:1.5;padding-left:6px}
.name-count{margin-top:6px;font-size:13px;color:#666}
button{min-height:44px;padding:10px 15px;border:0;border-radius:9px;font-weight:700;margin:5px 5px 0 0;background:#e9e9ed;cursor:pointer}
.primary{background:#111;color:#fff}.muted{font-size:13px;color:#666}.heat{border:1px solid #ddd;border-radius:10px;padding:10px;margin:8px 0}.team{display:inline-block;background:#eee;border-radius:6px;padding:4px 7px;margin:2px;font-size:13px}.ok{color:#087a35;font-weight:700}.bad{color:#b00020;font-weight:700}.scroll{overflow:auto}.matrix{border-collapse:collapse;font-size:11px}.matrix th,.matrix td{border:1px solid #ccc;padding:5px;text-align:center;white-space:nowrap}
</style>
</head>
<body>
<main>
<h1>MG-Draw</h1>
<div class="card">
<div class="grid">
<div><label>Number of teams</label><input id="n" type="number" min="2" max="30" value="14"></div>
<div><label>Sessions</label><input id="s" type="number" min="1" max="8" value="3"></div>
<div><label>Heats per session</label><input id="h" type="number" min="1" max="8" value="4"></div>
</div>
<div style="margin-top:10px"><label>Teams per heat</label><input id="caps" value="4,4,3,3"></div>
<div class="muted" style="margin-top:5px">The sum must equal the number of teams. Example: 14 = 4,4,3,3.</div>
<div style="margin-top:10px"><label>Team names – one per line</label><div id="nameList"></div><div id="nameCount" class="name-count">14 teams entered</div><div class="muted" style="margin-top:4px">Click × next to a team to delete it.</div></div>
<div style="margin-top:10px;padding:12px;border:1px dashed #bbb;border-radius:10px;background:#fafafa">
  <label>Import team list from file</label>
  <input id="importFile" type="file" accept=".xlsx,.xls,.pdf,.jpg,.jpeg,image/jpeg,application/pdf" style="display:none">
  <button type="button" id="importBtn">📄 Upload Excel / PDF / JPEG</button>
  <button type="button" id="clearNames">Clear team names</button>
  <div class="muted" style="margin-top:5px">Excel: first sheet. PDF/JPEG: text/OCR is read and added as one team per line. Check the list before calculating.</div>
  <div id="importStatus" class="muted" style="margin-top:6px" aria-live="polite"></div>
</div>
<button class="primary" id="calc">Calculate</button>
<button id="again">New variant</button>
<button id="excel" style="display:none">Download Excel</button>
<div id="status" class="muted" style="margin-top:9px" aria-live="polite">Ready.</div>
</div>
<div id="result"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id);};
var lastConfig=null,lastResult=null;
function renderNameInputs(){
  var list=$("nameList");
  var old=list.querySelectorAll(".name-input"), values=[];
  old.forEach(function(el){values.push(el.value);});

  var expected=parseInt($("n").value,10);
  if(!Number.isInteger(expected)||expected<0) expected=0;

  if(values.length!==expected){
    while(values.length<expected) values.push("");
    if(values.length>expected) values=values.slice(0,expected);
  }

  list.innerHTML="";

  values.forEach(function(value,index){
    var row=document.createElement("div");
    row.className="name-row";
    row.style.display="grid";
    row.style.gridTemplateColumns="32px 1fr 40px";
    row.style.gap="6px";
    row.style.alignItems="center";
    row.style.marginBottom="6px";

    var num=document.createElement("div");
    num.textContent=(index+1)+".";
    num.style.fontWeight="700";
    num.style.textAlign="right";
    num.style.paddingRight="7px";

    var input=document.createElement("input");
    input.className="name-input";
    input.type="text";
    input.value=value;
    input.placeholder="Team name";
    input.autocomplete="off";
    input.addEventListener("input",updateNameCount);

    var del=document.createElement("button");
    del.type="button";
    del.textContent="×";
    del.title="Delete this team";
    del.setAttribute("aria-label","Delete team "+(index+1));
    del.dataset.teamIndex=String(index);
    del.style.padding="7px 10px";
    del.style.fontSize="18px";
    del.style.lineHeight="1";
    del.style.margin="0";

    del.addEventListener("click",function(event){
      event.preventDefault();
      event.stopPropagation();

      var removeIndex=parseInt(this.dataset.teamIndex,10);
      var inputs=Array.from(document.querySelectorAll(".name-input"));
      var vals=inputs.map(function(el){return el.value;});

      if(!Number.isInteger(removeIndex) || removeIndex<0 || removeIndex>=vals.length){
        return;
      }

      vals.splice(removeIndex,1);
      $("n").value=vals.length;

      // Rebuild the rows so numbering and delete buttons are recreated
      // with the correct indexes.
      list.innerHTML="";
      vals.forEach(function(v){
        var dummy=document.createElement("input");
        dummy.className="name-input";
        dummy.value=v;
      });
      renderNameInputsFromValues(vals);

      $("importStatus").textContent="Team "+(removeIndex+1)+" deleted.";
    });

    row.appendChild(num);
    row.appendChild(input);
    row.appendChild(del);
    list.appendChild(row);
  });

  updateNameCount();
}

function renderNameInputsFromValues(values){
  var list=$("nameList");
  list.innerHTML="";

  values.forEach(function(value,index){
    var row=document.createElement("div");
    row.className="name-row";
    row.style.display="grid";
    row.style.gridTemplateColumns="32px 1fr 40px";
    row.style.gap="6px";
    row.style.alignItems="center";
    row.style.marginBottom="6px";

    var num=document.createElement("div");
    num.textContent=(index+1)+".";
    num.style.fontWeight="700";
    num.style.textAlign="right";
    num.style.paddingRight="7px";

    var input=document.createElement("input");
    input.className="name-input";
    input.type="text";
    input.value=value;
    input.placeholder="Team name";
    input.autocomplete="off";
    input.addEventListener("input",updateNameCount);

    var del=document.createElement("button");
    del.type="button";
    del.textContent="×";
    del.title="Delete this team";
    del.setAttribute("aria-label","Delete team "+(index+1));
    del.dataset.teamIndex=String(index);
    del.style.padding="7px 10px";
    del.style.fontSize="18px";
    del.style.lineHeight="1";
    del.style.margin="0";

    del.addEventListener("click",function(event){
      event.preventDefault();
      event.stopPropagation();

      var removeIndex=parseInt(this.dataset.teamIndex,10);
      var inputs=Array.from(document.querySelectorAll(".name-input"));
      var vals=inputs.map(function(el){return el.value;});

      if(!Number.isInteger(removeIndex) || removeIndex<0 || removeIndex>=vals.length) return;

      vals.splice(removeIndex,1);
      $("n").value=vals.length;
      renderNameInputsFromValues(vals);
      $("importStatus").textContent="Team "+(removeIndex+1)+" deleted.";
    });

    row.appendChild(num);
    row.appendChild(input);
    row.appendChild(del);
    list.appendChild(row);
  });

  updateNameCount();
}

function updateNameCount(){
  var expected=parseInt($("n").value,10);
  if(!Number.isInteger(expected)||expected<0) expected=0;
  var count=Array.from(document.querySelectorAll(".name-input")).filter(function(v){return v.value.trim();}).length;
  $("nameCount").textContent=count+" teams entered"+(count!==expected?" (should be "+expected+")":"");
}


function cleanImportedLines(lines){
  var bad=/^(teams|team names|team|teams|name|names|navn|nr\.?|nummer|number|startliste|start list|resultat|resultater)$/i;
  var out=[];
  lines.forEach(function(raw){
    var x=String(raw||"").replace(/\u00a0/g," ").trim();
    if(!x)return;
    x=x.replace(/^\s*\d+\s*[\.\):\-]\s*/,"").trim();
    if(!x || bad.test(x) || x.length>100)return;
    out.push(x);
  });
  var seen={};
  return out.filter(function(x){
    var k=x.toLocaleLowerCase();
    if(seen[k])return false;
    seen[k]=true;
    return true;
  });
}
function setImportedNames(names){
  names=cleanImportedLines(names);
  if(!names.length){
    $("importStatus").textContent="No clear team names were found in the file.";
    return;
  }
  $("n").value=names.length;
  renderNameInputs();
  var inputs=Array.from(document.querySelectorAll(".name-input"));
  names.forEach(function(name,i){if(inputs[i])inputs[i].value=name;});
  updateNameCount();
  $("importStatus").textContent="Found "+names.length+" possible team names. Check the list before calculating.";
}
function loadScriptOnce(src,id){
  return new Promise(function(resolve,reject){
    if(document.getElementById(id)){resolve();return;}
    var s=document.createElement("script");
    s.id=id;s.src=src;s.onload=resolve;s.onerror=function(){reject(new Error("Kunne not laste nødvendig bibliotek."));};
    document.head.appendChild(s);
  });
}
async function importExcel(file){
  if(typeof XLSX==="undefined") await loadScriptOnce("https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js","xlsx-lib");
  var wb=XLSX.read(await file.arrayBuffer(),{type:"array"});
  var ws=wb.Sheets[wb.SheetNames[0]];
  var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
  var lines=[];
  rows.forEach(function(r){
    if(r.length)lines.push(r[0]);
  });
  setImportedNames(lines);
}
async function importPdf(file){
  await loadScriptOnce("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs","pdfjs-lib");
  var pdfjs=window.pdfjsLib;
  if(!pdfjs)throw new Error("PDF-leseren kunne not startes.");
  pdfjs.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";
  var pdf=await pdfjs.getDocument({data:await file.arrayBuffer()}).promise;
  var lines=[];
  for(var p=1;p<=pdf.numPages;p++){
    var page=await pdf.getPage(p), content=await page.getTextContent(), items=content.items||[];
    var current="", lastY=null;
    items.forEach(function(item){
      var y=item.transform?item.transform[5]:null, text=(item.str||"").trim();
      if(!text)return;
      if(lastY!==null && Math.abs(y-lastY)>4 && current.trim()){lines.push(current.trim());current="";}
      current+=(current?" ":"")+text;
      lastY=y;
    });
    if(current.trim())lines.push(current.trim());
  }
  setImportedNames(lines);
}
async function importImage(file){
  await loadScriptOnce("https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js","tesseract-lib");
  if(!window.Tesseract)throw new Error("OCR kunne not startes.");
  $("importStatus").textContent="Reading image with OCR … this may take a little while.";
  var result=await Tesseract.recognize(file,"nor+eng",{
    logger:function(m){
      if(m.status&&typeof m.progress==="number")$("importStatus").textContent="OCR: "+m.status+" "+Math.round(m.progress*100)+" %";
    }
  });
  setImportedNames((result.data.text||"").split(/\r?\n/));
}
async function handleImportFile(file){
  if(!file)return;
  $("importStatus").textContent="Reading "+file.name+" …";
  try{
    var ext=(file.name.split(".").pop()||"").toLowerCase();
    if(ext==="xlsx"||ext==="xls")await importExcel(file);
    else if(ext==="pdf")await importPdf(file);
    else if(ext==="jpg"||ext==="jpeg")await importImage(file);
    else throw new Error("File type not supported.");
  }catch(err){
    console.error(err);
    $("importStatus").textContent="Could not read the file. Try another file or enter the names manually.";
  }
}
$("importBtn").addEventListener("click",function(){$("importFile").click();});
$("importFile").addEventListener("change",function(e){handleImportFile(e.target.files[0]);e.target.value="";});
$("clearNames").addEventListener("click",function(){
  $("nameList").querySelectorAll(".name-input").forEach(function(x){x.value="";});
  updateNameCount();
  $("importStatus").textContent="";
});

function getConfig(){
  var n=parseInt($("n").value,10), s=parseInt($("s").value,10), h=parseInt($("h").value,10);
  var caps=$("caps").value.split(",").map(function(x){return parseInt(x.trim(),10);});
  var names=Array.from(document.querySelectorAll(".name-input")).map(function(x){return x.value.trim();}).filter(Boolean);
  return {n:n,s:s,h:h,caps:caps,names:names};
}
function validate(c){
  if(!Number.isInteger(c.n)||c.n<2||c.n>30)return"Number of teams must be between 2 and 30.";
  if(!Number.isInteger(c.s)||c.s<1||c.s>8)return"Sessions must be between 1 and 8.";
  if(!Number.isInteger(c.h)||c.h<1||c.h>8)return"Heats per session must be between 1 and 8.";
  if(c.caps.length!==c.h)return"You must enter "+c.h+" heat sizes, separated by commas.";
  if(c.caps.some(function(x){return !Number.isInteger(x)||x<1;}))return"All heats must have at least 1 team.";
  if(c.caps.reduce(function(a,b){return a+b;},0)!==c.n)return"Heat sizes must add up to the number of teams.";
  if(c.names.length!==c.n)return"You have "+c.names.length+" team names, but "+c.n+" teams.";
  if(new Set(c.names).size!==c.names.length)return"Team names must be unique.";
  return "";
}
function shuffle(a){
  for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}
  return a;
}
function makeCandidate(c){
  var N=c.n,S=c.s,H=c.h,max=Math.max.apply(null,c.caps);
  var meet=Array.from({length:N},function(){return Array(N).fill(0);});
  var used=Array.from({length:N},function(){return Array(H).fill(0);});
  var sessions=[];
  for(var ss=0;ss<S;ss++){
    var rem=new Set(Array.from({length:N},function(_,i){return i;}));
    var order=Array.from({length:H},function(_,i){return i;}).sort(function(a,b){return c.caps[b]-c.caps[a]||Math.random()-.5;});
    var sess=Array.from({length:H},function(){return[];});
    for(var oi=0;oi<order.length;oi++){
      var hh=order[oi], chosen=[];
      while(chosen.length<c.caps[hh]){
        var best=null,bestScore=Infinity;
        rem.forEach(function(i){
          var repeat=0,newOpp=0,over=0;
          for(var k=0;k<chosen.length;k++){
            var j=chosen[k];repeat+=meet[i][j];if(meet[i][j]===0)newOpp++;if(meet[i][j]>=2)over++;
          }
          var score=over*100000+repeat*1000-used[i][hh]*30-newOpp*8+Math.random();
          if(score<bestScore){bestScore=score;best=i;}
        });
        chosen.push(best);rem.delete(best);
      }
      shuffle(chosen);sess[hh]=chosen;
      chosen.forEach(function(i){used[i][hh]++;});
      for(var a=0;a<chosen.length;a++)for(var b=a+1;b<chosen.length;b++){
        meet[chosen[a]][chosen[b]]++;meet[chosen[b]][chosen[a]]++;
      }
    }
    sessions.push(sess);
  }
  var small=new Set(),full=new Set(),unique=0,repeats=0,maxPair=0,over3=0;
  for(var s=0;s<S;s++)for(var h=0;h<H;h++)for(var z=0;z<sessions[s][h].length;z++){
    var team=sessions[s][h][z];(c.caps[h]<max?small:full).add(team);
  }
  for(var i=0;i<N;i++)for(var j=i+1;j<N;j++){
    if(meet[i][j]>0)unique++;
    if(meet[i][j]>1)repeats+=meet[i][j]-1;
    if(meet[i][j]>maxPair)maxPair=meet[i][j];
    if(meet[i][j]>2)over3++;
  }
  var heatVar=0;
  for(var i2=0;i2<N;i2++)heatVar+=used[i2].filter(Boolean).length;
  return {sessions:sessions,meet:meet,small:small.size,full:full.size,unique:unique,repeats:repeats,maxPair:maxPair,over3:over3,heatVar:heatVar};
}
function better(a,b){
  if(!b)return true;
  var A=[a.small,a.full,a.unique,-a.over3,-a.maxPair,-a.repeats,a.heatVar];
  var B=[b.small,b.full,b.unique,-b.over3,-b.maxPair,-b.repeats,b.heatVar];
  for(var i=0;i<A.length;i++){if(A[i]!==B[i])return A[i]>B[i];}
  return false;
}
function solve(c){
  var best=null,tries=Math.min(3500,Math.max(800,c.n*180));
  for(var k=0;k<tries;k++){var z=makeCandidate(c);if(better(z,best))best=z;}
  return best;
}
function render(c,z){
  var out='<div class="card"><b>Checks</b><p>Lag i små heat: <b>'+z.small+'/'+c.n+'</b><br>Lag i fulle heat: <b>'+z.full+'/'+c.n+'</b><br>Forskjellige motstanderpar: <b>'+z.unique+'</b><br>Maks møter mellom samme par: <b>'+z.maxPair+'</b><br>Lagpar med mer enn 2 møter: <b>'+z.over3+'</b><br>Repeated meetings utover første: <b>'+z.repeats+'</b></p><div class="muted">Dette er en søkebasert optimalisering. Den beviser not matematisk optimum.</div></div>';
  for(var s=0;s<c.s;s++){
    out+='<div class="card"><h2>Session '+(s+1)+'</h2>';
    for(var h=0;h<c.h;h++){
      var ids=z.sessions[s][h].slice();shuffle(ids);
      out+='<div class="heat"><b>Heat '+(h+1)+' – '+ids.length+' teams</b><br>'+ids.map(function(i){return'<span class="team">'+c.names[i]+'</span>';}).join("")+'</div>';
    }
    out+='</div>';
  }
  var reps=[];
  for(var i=0;i<c.n;i++)for(var j=i+1;j<c.n;j++)if(z.meet[i][j]>1)reps.push(c.names[i]+' – '+c.names[j]+' ('+z.meet[i][j]+' møter)');
  out+='<div class="card"><b>Repeated meetings</b><p>'+(reps.length?reps.join("<br>"):"None")+'</p></div>';
  out+='<div class="card"><b>Komplett møte-matrise</b><div class="scroll"><table class="matrix"><tr><th></th>'+c.names.map(function(n){return"<th>"+n+"</th>";}).join("")+'</tr>';
  for(var i=0;i<c.n;i++)out+='<tr><th>'+c.names[i]+'</th>'+c.names.map(function(_,j){return"<td>"+(i===j?"–":z.meet[i][j])+"</td>";}).join("")+'</tr>';
  out+='</table></div></div>';
  $("result").innerHTML=out;
}
function exportExcel(){
  if(!lastConfig||!lastResult){return;}
  if(typeof XLSX==='undefined'){
    alert('Excel-funksjonen kunne not lastes. Checkser at du har internettforbindelse og prøv igjen.');
    return;
  }
  var c=lastConfig,z=lastResult,wb=XLSX.utils.book_new();
  var rows=[
    ['MG-Draw – resultat'],
    ['Number of teams',c.n],['Sessions',c.s],['Heats per session',c.h],['Teams per heat',c.caps.join(', ')],[],
    ['Checks'],
    ['Lag i små heat',z.small+'/'+c.n],
    ['Lag i fulle heat',z.full+'/'+c.n],
    ['Forskjellige motstanderpar',z.unique],
    ['Maks møter mellom samme par',z.maxPair],
    ['Lagpar med mer enn 2 møter',z.over3],
    ['Repeated meetings utover første',z.repeats],[]
  ];
  for(var ss=0;ss<c.s;ss++){
    rows.push(['Session '+(ss+1)]);
    for(var hh=0;hh<c.h;hh++){
      var ids=z.sessions[ss][hh];
      rows.push(['Heat '+(hh+1)].concat(ids.map(function(i){return c.names[i];})));
    }
    rows.push([]);
  }
  var ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:28},{wch:20},{wch:20},{wch:20},{wch:20},{wch:20}];
  XLSX.utils.book_append_sheet(wb,ws,'Result');

  var matrix=[['Møte-matrise'].concat(Array(c.n).fill('')),[""].concat(c.names)];
  for(var i=0;i<c.n;i++){
    matrix.push([c.names[i]].concat(c.names.map(function(_,j){return i===j?'':z.meet[i][j];})));
  }
  var wm=XLSX.utils.aoa_to_sheet(matrix);
  XLSX.utils.book_append_sheet(wb,wm,'Meeting matrix');

  var rep=[['Lag 1','Lag 2','Antall møter']];
  for(var i2=0;i2<c.n;i2++)for(var j2=i2+1;j2<c.n;j2++)if(z.meet[i2][j2]>1)rep.push([c.names[i2],c.names[j2],z.meet[i2][j2]]);
  if(rep.length===1)rep.push(['None gjentatte møter','','']);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rep),'Repeated meetings');

  var now=new Date();
  var stamp=now.getFullYear()+String(now.getMonth()+1).padStart(2,'0')+String(now.getDate()).padStart(2,'0')+'_'+String(now.getHours()).padStart(2,'0')+String(now.getMinutes()).padStart(2,'0');
  XLSX.writeFile(wb,'MG-Draw_'+stamp+'.xlsx');
}
function run(){
  var c=getConfig(),err=validate(c);
  $("result").innerHTML="";
  if(err){$("status").innerHTML='<span class="bad">'+err+'</span>';return;}
  $("calc").disabled=true;$("again").disabled=true;$("status").textContent="Calculateer…";
  setTimeout(function(){
    try{
      var z=solve(c);lastConfig=c;lastResult=z;render(c,z);$("excel").style.display="inline-block";
      $("status").innerHTML='<span class="ok">Ferdig.</span> Resultet er beregnet.';
    }catch(e){$("status").innerHTML='<span class="bad">Error: '+e.message+'</span>';}
    $("calc").disabled=false;$("again").disabled=false;
  },30);
}
$("calc").addEventListener("click",run);
$("again").addEventListener("click",run);
$("excel").addEventListener("click",exportExcel);
$("n").addEventListener("input",renderNameInputs);
renderNameInputs();
})();
